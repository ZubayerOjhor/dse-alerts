<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <style>
      .box { fill: #fcfcfb; stroke: #c3c2b7; stroke-width: 1.2; rx: 8; }
      .src { fill: #eef4fc; stroke: #2a78d6; }
      .store { fill: #f0efec; stroke: #898781; }
      .out { fill: #ecf8f1; stroke: #1baf7a; }
      .t { fill: #0b0b0b; font-weight: 600; }
      .s { fill: #52514e; font-size: 11.5px; }
      .lbl { fill: #6b7280; font-size: 11px; }
      .flow { stroke: #6b7280; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .lane { fill: #898781; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    </style>
  </defs>

  <text x="20" y="28" class="lane">SOURCES</text>
  <rect x="20" y="40" width="200" height="64" class="box src"/>
  <text x="32" y="62" class="t">dse.com.bd (live)</text>
  <text x="32" y="80" class="s">daily OHLCV, PSI news, dividends,</text>
  <text x="32" y="94" class="s">index, company profiles · via bdshare</text>

  <rect x="20" y="118" width="200" height="64" class="box src"/>
  <text x="32" y="140" class="t">Curated archive 2012–2026</text>
  <text x="32" y="158" class="s">Mendeley, CC BY 4.0 · passes the</text>
  <text x="32" y="172" class="s">circuit-breaker consistency test</text>

  <rect x="20" y="196" width="200" height="50" class="box src"/>
  <text x="32" y="218" class="t">Your statements</text>
  <text x="32" y="236" class="s">holdings.csv · watchlist.json</text>

  <text x="300" y="28" class="lane">STORE &amp; FEATURES</text>
  <rect x="300" y="40" width="220" height="92" class="box store"/>
  <text x="312" y="62" class="t">DuckDB · market.duckdb</text>
  <text x="312" y="80" class="s">prices · instruments · fundamentals</text>
  <text x="312" y="94" class="s">news · dividends · index</text>
  <text x="312" y="108" class="s">features: returns, vol ratio, SMAs,</text>
  <text x="312" y="122" class="s">circuit hits, 250-session range</text>

  <rect x="300" y="146" width="220" height="64" class="box store"/>
  <text x="312" y="168" class="t">Calibration (14 years)</text>
  <text x="312" y="186" class="s">per-stock percentiles → symbol_stats</text>
  <text x="312" y="200" class="s">event study per rule → docs/calibration.md</text>

  <rect x="300" y="224" width="220" height="50" class="box store"/>
  <text x="312" y="246" class="t">SQLite · app.sqlite</text>
  <text x="312" y="264" class="s">users · watchlists · holdings · alerts · runs</text>

  <text x="600" y="28" class="lane">ENGINE</text>
  <rect x="600" y="40" width="200" height="118" class="box"/>
  <text x="612" y="62" class="t">13 rules, facts only</text>
  <text x="612" y="80" class="s">big move vs own percentiles</text>
  <text x="612" y="94" class="s">circuit hits &amp; streaks · volume spike</text>
  <text x="612" y="108" class="s">range breaks · PSI · record dates</text>
  <text x="612" y="122" class="s">vs DSEX · MA cross · P/E · thin trading</text>
  <text x="612" y="146" class="s">dedup per user · scorecard afterwards</text>

  <rect x="600" y="172" width="200" height="50" class="box"/>
  <text x="612" y="194" class="t">AI summary (optional)</text>
  <text x="612" y="212" class="s">Groq → OpenRouter → Claude; explains, never advises</text>

  <text x="880" y="28" class="lane">DELIVERY</text>
  <rect x="880" y="40" width="200" height="40" class="box out"/>
  <text x="892" y="65" class="t">Email (HTML + text)</text>
  <rect x="880" y="92" width="200" height="40" class="box out"/>
  <text x="892" y="117" class="t">Telegram</text>
  <rect x="880" y="144" width="200" height="40" class="box out"/>
  <text x="892" y="169" class="t">Local outbox</text>
  <rect x="880" y="196" width="200" height="78" class="box out"/>
  <text x="892" y="218" class="t">Web UI · dse web serve</text>
  <text x="892" y="236" class="s">overview · portfolio · targets · symbol</text>
  <text x="892" y="250" class="s">alerts · scorecard · rules · 4 themes</text>
  <text x="892" y="264" class="s">charts vendored; browser talks only to this server</text>

  <path d="M220,72 L300,72" class="flow"/>
  <path d="M220,150 L300,86" class="flow"/>
  <path d="M220,221 L300,249" class="flow"/>
  <path d="M520,86 L600,86" class="flow"/>
  <path d="M520,178 L600,120" class="flow"/>
  <path d="M520,249 L600,140" class="flow"/>
  <path d="M800,99 L880,60" class="flow"/>
  <path d="M800,99 L880,112" class="flow"/>
  <path d="M800,99 L880,164" class="flow"/>
  <path d="M800,197 L880,235" class="flow"/>
  <path d="M700,158 L700,172" class="flow"/>

  <text x="20" y="320" class="lane">RUNS</text>
  <rect x="20" y="332" width="340" height="96" class="box"/>
  <text x="32" y="354" class="t">GitHub Actions · 16:30 BDT, Sun–Thu</text>
  <text x="32" y="372" class="s">market data cached between runs; secrets hold SMTP,</text>
  <text x="32" y="386" class="s">Telegram, watchlist and holdings; outbox kept as artifact</text>
  <text x="32" y="404" class="s">Also: Task Scheduler / cron, or docker compose</text>

  <rect x="380" y="332" width="340" height="96" class="box"/>
  <text x="392" y="354" class="t">Data audit before trust</text>
  <text x="392" y="372" class="s">archive vs live: 100% on 7,062 rows · weekend-session check</text>
  <text x="392" y="386" class="s">moves beyond the circuit cap: 0.05–0.5%/yr (clean) vs 17–20%</text>
  <text x="392" y="404" class="s">(the misdated 1999–2022 file, rejected) · docs/data-quality.md</text>

  <rect x="740" y="332" width="340" height="96" class="box"/>
  <text x="752" y="354" class="t">Principles</text>
  <text x="752" y="372" class="s">Your data stays yours: self-hosted, no telemetry, BYO keys</text>
  <text x="752" y="386" class="s">Alerts are facts, not advice; thresholds are measured,</text>
  <text x="752" y="404" class="s">not guessed; the system grades its own alerts in public</text>
</svg>
