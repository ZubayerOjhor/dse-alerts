<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}dse-alerts{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">dse-alerts</a>
  {% if user %}
  <nav>
    <a href="/">Watchlist</a>
    <a href="/alerts">Alerts</a>
    <a href="/scorecard">Scorecard</a>
    <a href="/rules">Rules</a>
    <a href="/settings">Settings</a>
    <form method="post" action="/logout" class="inline"><button class="link">Log out</button></form>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>Automated observations about prices, volumes and filings on the Dhaka Stock Exchange. Not investment advice; no buy or sell recommendation is implied. Runs entirely on this machine.</p>
</footer>
</body>
</html>
