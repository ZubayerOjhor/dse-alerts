[project]
name = "dse-alerts"
version = "0.1.0"
description = "Self-hosted stock alerts for the Dhaka Stock Exchange: rule-based, calibrated on 25 years of daily data, delivered by email."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md. Zubayer" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "bdshare>=1.2.8",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.2", "argon2-cffi>=23"]
ai = ["anthropic>=0.40", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
dse = "dse_alerts.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dse_alerts*"]

[tool.setuptools.package-data]
dse_alerts = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"dse_alerts/cli.py" = ["B008"]       # typer.Option/Argument in defaults is the typer idiom
"dse_alerts/web/app.py" = ["B008"]   # FastAPI's Depends() in defaults, likewise

[tool.pytest.ini_options]
testpaths = ["tests"]
