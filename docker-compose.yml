# docker compose up -d
#   web        the UI on http://localhost:8000
#   scheduler  pulls data, rebuilds features and runs alerts at 16:30 Bangladesh time, Sun-Thu
# Both share the /data volume. Put SMTP_* and AI_* settings in .env next to this file.
services:
  web:
    build: .
    env_file: .env
    environment:
      DSE_DATA_DIR: /data
      APP_HOST: 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - dse-data:/data
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      DSE_DATA_DIR: /data
      TZ: Asia/Dhaka
    volumes:
      - dse-data:/data
    restart: unless-stopped
    # first start: load the archive and baselines (and seed the demo account when APP_DEMO=1);
    # then refresh, rebuild features and run the alerts at 16:30 Dhaka time on trading days
    command: ["sh", "scripts/scheduler.sh"]

volumes:
  dse-data:
